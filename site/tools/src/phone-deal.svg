<svg xmlns="http://www.w3.org/2000/svg" width="2322" height="2322" viewBox="0 0 2322 2322">
<title>Cartworth weekly-ad deal with its conditions, illustrated</title>
<desc>Illustration of the Cartworth iPhone app, not a screenshot. Store names are stand-ins. Example prices, September 2026. Square working canvas; the shipped image is the centre 1290x2322 band.</desc>
<rect width="2322" height="2322" fill="#F1F2F4"/>
<g transform="translate(516,0)"><rect x="0" y="0" width="1290" height="2322" rx="0" fill="#FFFFFF"/><rect x="585" y="34" width="120" height="12" rx="6" fill="#D6D9DC"/><text x="96" y="190" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#101A13" text-anchor="start">2% reduced fat milk, 1 gal</text><rect x="1042" y="130" width="200" height="84" rx="42" fill="#EFF0F2"/><text x="1142" y="186" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="#3D5247" text-anchor="middle">Done</text><circle cx="112" cy="262" r="15" fill="#0072b2"/><text x="146" y="278" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="650" fill="#101A13" text-anchor="start">Store B</text><rect x="348" y="240" width="208" height="54" rx="27" fill="#FFEDE2"/><text x="452" y="278.52" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#A8390C" text-anchor="middle">weekly ad</text><text x="584" y="278" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="500" fill="#6E7C73" text-anchor="start">2.1 mi</text><text x="96" y="430" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="136" font-weight="800" fill="#101A13" text-anchor="start" letter-spacing="-3">$2.99</text><text x="482" y="430" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="600" fill="#6E7C73" text-anchor="start">/gal</text><text x="96" y="500" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="500" fill="#A8390C" text-anchor="start">with the store's digital coupon</text><rect x="48" y="560" width="1194" height="560" rx="54" fill="#F7F8F9"/><text x="96" y="640" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#101A13" text-anchor="start">Conditions</text><text x="96" y="706" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="500" fill="#6E7C73" text-anchor="start">Must buy</text><text x="1194" y="706" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="650" fill="#101A13" text-anchor="end">4 participating items</text><line x1="96" y1="738" x2="1194" y2="738" stroke="#E8EAEC" stroke-width="2"/><text x="96" y="804" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="500" fill="#6E7C73" text-anchor="start">Limit</text><text x="1194" y="804" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="650" fill="#101A13" text-anchor="end">2 per household, per day</text><line x1="96" y1="836" x2="1194" y2="836" stroke="#E8EAEC" stroke-width="2"/><text x="96" y="902" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="500" fill="#6E7C73" text-anchor="start">Without the coupon</text><text x="1194" y="902" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="650" fill="#101A13" text-anchor="end">$4.29 / gal</text><line x1="96" y1="934" x2="1194" y2="934" stroke="#E8EAEC" stroke-width="2"/><text x="96" y="1000" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="500" fill="#6E7C73" text-anchor="start">Ad runs</text><text x="1194" y="1000" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="650" fill="#101A13" text-anchor="end">Wed 17 Sep – Tue 23 Sep</text><rect x="48" y="1166" width="1194" height="250" rx="54" fill="#F7F8F9"/><text x="96" y="1246" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#101A13" text-anchor="start">Unit price</text><text x="96" y="1310" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" font-weight="400" fill="#6E7C73" text-anchor="start">Per volume</text><text x="1194" y="1310" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" font-weight="500" fill="#101A13" text-anchor="end">2.34¢/fl oz · 74.8¢/qt</text><text x="1194" y="1372" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" font-weight="500" fill="#101A13" text-anchor="end">$2.99/gal · 79.0¢/L</text><rect x="48" y="1478" width="1194" height="118" rx="59" fill="#168F4A"/><text x="645" y="1552" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="650" fill="#FFFFFF" text-anchor="middle">Add to list</text><rect x="48" y="1626" width="580" height="118" rx="59" fill="#EFF0F2"/><text x="338" y="1700" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="600" fill="#3D5247" text-anchor="middle">Watch price</text><rect x="662" y="1626" width="580" height="118" rx="59" fill="#EFF0F2"/><text x="952" y="1700" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="600" fill="#3D5247" text-anchor="middle">Open the ad</text><text x="96" y="1836" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#8E9A93" text-anchor="start">Ad prices come from the store's own weekly ad and</text><text x="96" y="1890" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#8E9A93" text-anchor="start">can differ from the shelf tag. Always check the tag.</text><rect x="0" y="2140" width="1290" height="182" rx="0" fill="#FBFBFC"/><line x1="0" y1="2140" x2="1290" y2="2140" stroke="#E8EAEC" stroke-width="2"/><g transform="translate(100,2175) scale(2.41667)" fill="none" stroke="#98A29C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 11 m-7 0 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0 M16.6 16.6 L21 21"/></g><text x="129" y="2268" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#98A29C" text-anchor="middle">Search</text><g transform="translate(358,2175) scale(2.41667)" fill="none" stroke="#168F4A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0l-7.2-7.2A2 2 0 0 1 3 12V4a1 1 0 0 1 1-1h8a2 2 0 0 1 1.4.6l7.2 7.2a2 2 0 0 1 0 2.8Z M7.6 7.6h.01"/></g><text x="387" y="2268" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#168F4A" text-anchor="middle">Deals</text><g transform="translate(616,2175) scale(2.41667)" fill="none" stroke="#98A29C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12 M9 12h12 M9 18h12 M4 6h.01 M4 12h.01 M4 18h.01"/></g><text x="645" y="2268" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#98A29C" text-anchor="middle">List</text><g transform="translate(874,2175) scale(2.41667)" fill="none" stroke="#98A29C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 14.6 9l5.9.7-4.4 4 1.2 5.8L12 16.6 6.7 19.5l1.2-5.8-4.4-4L9.4 9Z"/></g><text x="903" y="2268" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#98A29C" text-anchor="middle">Tracking</text><g transform="translate(1132,2175) scale(2.41667)" fill="none" stroke="#98A29C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0-6 0 M12 2.5v3 M12 18.5v3 M2.5 12h3 M18.5 12h3 M5.2 5.2l2.1 2.1 M16.7 16.7l2.1 2.1 M18.8 5.2l-2.1 2.1 M7.3 16.7l-2.1 2.1"/></g><text x="1161" y="2268" font-family="-apple-system, system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#98A29C" text-anchor="middle">Settings</text></g>
