<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cartworth — compare grocery prices near you</title>
  <meta name="description" content="Compare grocery prices at the stores near any US ZIP code. Live prices converted to the same unit so package sizes compare fairly, each one labelled with where it came from, plus the weekly ads." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c7c4b'/%3E%3Cpath d='M14 26h36l-4 22a4 4 0 0 1-4 3H22a4 4 0 0 1-4-3z' fill='%23fff'/%3E%3Cpath d='M22 26l8-12M42 26l-8-12' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
  <!--
    No inline scripts, on purpose. The static host (site/_headers, netlify.toml, vercel.json) ships
    Content-Security-Policy script-src 'self' with no 'unsafe-inline', and says its pages carry no
    inline scripts. This page used to carry two: the pre-paint theme snippet, now
    /js/theme-boot.js, and an import map for "preact"/"htm". Browsers only accept an import map
    inline, and under script-src 'self' it is blocked — no module resolves and the app never gets
    past "Loading Cartworth…". So there is no import map: the modules import /vendor/*.mjs by path.
    Allowing it by hash instead would tie three config files outside public/ to the exact bytes
    of this one. test/qa-app-behaviour.test.js boots the app under the host's exact policy.
  -->
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div id="app"><div class="boot">Loading Cartworth…</div></div>
  <noscript>Cartworth needs JavaScript enabled.</noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
